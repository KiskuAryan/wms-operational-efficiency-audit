<svg xmlns="http://www.w3.org/2000/svg" width="750" height="360" viewBox="0 0 750 360" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
        <text x="375" y="32" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">Allocation Dwell Time Across Shift Operating Hours</text>
        <text x="375" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">[Simulation Model: Modeled Midday Volume Surge between 10:00 and 14:00]</text>
        
        <line x1="80" y1="280" x2="680" y2="280" stroke="#334155" stroke-width="2"/>
        
        <!-- Peak Zone Box (10:00 to 14:00 indices: 2 to 6 => x: 200 to 480) -->
        <rect x="200" y="65" width="280" height="215" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-dasharray="4"/>
        <text x="340" y="85" text-anchor="middle" fill="#f87171" font-size="12" font-weight="bold">Peak Shift Congestion (10:00 - 14:00)</text>

        <!-- Dynamic Polyline -->
        <polyline fill="none" stroke="#38bdf8" stroke-width="3" points="100,232 160,234 220,102 280,99 340,106 400,98 460,102 520,231 580,231 640,235"/>
        <circle cx="100" cy="232" r="3" fill="#38bdf8"/>
        <circle cx="160" cy="234" r="3" fill="#38bdf8"/>
        <circle cx="220" cy="102" r="3" fill="#38bdf8"/>
        <circle cx="280" cy="99" r="3" fill="#38bdf8"/>
        <circle cx="340" cy="106" r="3" fill="#38bdf8"/>
        <circle cx="400" cy="98" r="5" fill="#ef4444"/><text x="400" y="86" text-anchor="middle" fill="#f8fafc" font-size="11">13:00 Peak (45.4 min)</text>
        <circle cx="460" cy="102" r="3" fill="#38bdf8"/>
        <circle cx="520" cy="231" r="3" fill="#38bdf8"/>
        <circle cx="580" cy="231" r="3" fill="#38bdf8"/>
        <circle cx="640" cy="235" r="3" fill="#38bdf8"/>

        <text x="375" y="315" text-anchor="middle" fill="#94a3b8" font-size="12">Operating Shift Hours (08:00 - 17:00)</text>
    </svg>